name: Intégration continue

# Ce qui doit être vrai avant qu'un changement parte en déploiement.
#
# Deux travaux indépendants, pas un seul enchaîné : une erreur de typage
# dans la boutique n'a aucune raison de masquer un test backend qui casse.
# Les deux rapports arrivent ensemble.
#
# Le déploiement, lui, n'est plus ici : c'est Coolify qui construit et met
# en ligne à chaque poussée sur `master`.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Une nouvelle poussée annule la vérification en cours sur la même
  # branche : inutile de payer deux fois pour un état déjà dépassé.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — tests
    runs-on: ubuntu-latest

    # ⚠️ **PostgreSQL, et non SQLite.** Les deux diffèrent sur les
    # transactions, les contraintes et les types : une suite verte sur
    # SQLite ne prouverait rien de la production.
    services:
      base:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: groupachat
          POSTGRES_USER: groupachat
          POSTGRES_PASSWORD: motdepasse-de-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groupachat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://groupachat:motdepasse-de-test@localhost:5432/groupachat
      DJANGO_SECRET_KEY: cle-de-test-sans-valeur
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SMS_FOURNISSEUR: demonstration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Contrôles de déploiement
        working-directory: backend
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: achatgr.com,admin.achatgr.com

      - name: Migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Tests
        working-directory: backend
        run: python -m pytest

  interfaces:
    name: Boutique et console — typage et construction
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` et non `npm install` : il installe exactement les versions
      # du fichier de verrouillage, et échoue si celui-ci n'est pas à jour.
      # Les trois espaces de travail sont installés d'un coup.
      - name: Dépendances
        working-directory: frontend
        run: npm ci

      - name: Typage des deux applications
        working-directory: frontend
        run: npx tsc -b boutique admin

      - name: Construction de la boutique
        working-directory: frontend
        run: npm run build --workspace boutique

      - name: Construction de la console
        working-directory: frontend
        run: npm run build --workspace admin

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    # Vérifier que l'image se construit, sans la pousser nulle part :
    # Coolify la reconstruit de son côté, mais mieux vaut découvrir une
    # erreur de Dockerfile ici que pendant un déploiement.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
