# Déploiement — publie les images, puis les installe sur le serveur.
#
# ## Le principe
#
# ```
# étiquette v*  →  construire et publier 3 images sur GHCR  →  SSH  →  pull + up -d
# ```
#
# ⚠️ **Le serveur ne construit rien.** Il tire des images déjà faites. Deux
# raisons, et la seconde est la plus importante :
#
# - un `vite build` demande Node et plus de mémoire qu'un petit VPS à un cœur ;
# - **on déploie l'image que l'intégration continue a validée**, pas une
#   reconstruction du même code. Construire deux fois, c'est se donner deux
#   occasions d'obtenir deux résultats.
#
# ## Ce qu'il faut configurer avant le premier déploiement
#
# Dans *Settings → Secrets and variables → Actions* du dépôt :
#
# | | Nom | Contenu |
# |---|---|---|
# | Variable | `VITE_API_URL` | `https://api.votredomaine.tg/api` — l'adresse **publique** de l'API |
# | Secret | `SSH_HOTE` | le nom ou l'IP du serveur |
# | Secret | `SSH_UTILISATEUR` | le compte de déploiement |
# | Secret | `SSH_CLE_PRIVEE` | la clé privée SSH, en entier |
# | Secret | `SSH_PORT` | *(facultatif)* 22 par défaut |
#
# `VITE_API_URL` est une **variable** et non un secret : elle est inscrite en
# clair dans le JavaScript servi à tous les visiteurs, donc la cacher ne
# servirait à rien — et un secret serait masqué dans les journaux, où on veut
# justement pouvoir relire quelle adresse a été utilisée.
#
# Voir `DEPLOIEMENT.md` pour la préparation du serveur.

name: Déploiement

on:
  push:
    # Les étiquettes de version : `git tag v1.0.0 && git push --tags`.
    tags: ["v*"]
  # Permet de déployer une version précise à la main, y compris de revenir en
  # arrière en redonnant une étiquette plus ancienne.
  workflow_dispatch:
    inputs:
      etiquette:
        description: "L'étiquette d'image à déployer (par défaut : celle du commit)"
        required: false
        type: string

# ⚠️ **Jamais deux déploiements à la fois**, et `cancel-in-progress: false` —
# contrairement à l'intégration continue. Interrompre un déploiement au milieu
# d'un `docker compose up` laisse le serveur dans un état mixte, avec une
# partie des services sur l'ancienne version. On attend plutôt que le
# précédent finisse.
concurrency:
  group: deploiement
  cancel-in-progress: false

env:
  REGISTRE: ghcr.io

jobs:
  # ── Publier les images ───────────────────────────────────────────────────
  publier:
    name: Construire et publier l'image de l'API
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Nécessaire pour pousser sur GHCR avec le `GITHUB_TOKEN` : sans cette
      # ligne, le jeton est en lecture seule et le `push` échoue en 403.
      packages: write

    outputs:
      etiquette: ${{ steps.version.outputs.etiquette }}

    steps:
      - uses: actions/checkout@v4

      - name: Déterminer l'étiquette
        id: version
        run: |
          if [ -n "${{ inputs.etiquette }}" ]; then
            ETIQ="${{ inputs.etiquette }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ETIQ="${GITHUB_REF_NAME}"
          else
            # Le court identifiant du commit : toujours non ambigu, et il
            # permet de déployer depuis une branche sans poser d'étiquette.
            ETIQ="$(git rev-parse --short HEAD)"
          fi
          echo "etiquette=$ETIQ" >> "$GITHUB_OUTPUT"
          echo "Étiquette : $ETIQ"

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` vaut `proprietaire/depot`, mis en minuscules parce
      # que les noms d'images ne tolèrent pas les majuscules — un dépôt nommé
      # avec une capitale ferait échouer le `push` sans que la cause soit
      # évidente.
      - name: Préfixe des images
        id: prefixe
        run: echo "valeur=${REGISTRE}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: L'API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.prefixe.outputs.valeur }}/api:${{ steps.version.outputs.etiquette }}
            ${{ steps.prefixe.outputs.valeur }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # ⚠️⚠️ **Deux etapes ont ete retirees d'ici : « La boutique » et
      # « L'administration ».**
      #
      # Elles construisaient `frontend/Dockerfile` sur les cibles `boutique` et
      # `admin`, deux images nginx, et les publiaient sur GHCR. **Ce
      # `Dockerfile` n'existe plus** : le front est construit et servi par
      # Coolify, qui n'a besoin d'aucune image.
      #
      # Ce workflow ne publie donc plus qu'une image, celle de l'API.
      #
      # ⚠️ **`VITE_API_URL` n'a pas disparu, elle a change de place.** Elle
      # reste une variable de **construction** : Vite l'inscrit en clair dans
      # le JavaScript produit, et aucun serveur Node ne la relit au demarrage.
      # Elle doit donc etre posee **dans Coolify, cote construction** du front.
      # La poser en variable d'execution n'a aucun effet et ne provoque aucune
      # erreur : le navigateur du visiteur appelle alors `127.0.0.1:8000`,
      # c'est-a-dire sa propre machine. C'est le piege le plus couteux de
      # toute cette chaine, et il ne previent jamais.
      #
      # La garde qui verifiait cette variable a aussi ete retiree, plus haut :
      # elle controlait un reglage de ce depot, et le reglage vit maintenant
      # ailleurs. La laisser aurait fait echouer le deploiement de l'API pour
      # une variable que ce workflow n'emploie plus.


  # ── Installer sur le serveur ─────────────────────────────────────────────
  installer:
    name: Installer sur le serveur
    runs-on: ubuntu-latest
    needs: publier

    # L'environnement permet d'exiger une approbation manuelle avant la mise
    # en ligne : *Settings → Environments → production → Required reviewers*.
    # Recommandé dès qu'il y a de vrais acheteurs derrière.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CLE_PRIVEE }}" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # `ssh-keyscan` plutôt que `StrictHostKeyChecking=no` : on enregistre
          # l'empreinte réelle du serveur au lieu de désactiver la
          # vérification, ce qui laisserait passer une interception.
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOTE }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Le serveur ne reçoit que deux fichiers : le Compose de production et
      # le `.env`. Pas de code source — il n'en a pas besoin, puisqu'il ne
      # construit rien.
      - name: Envoyer le fichier Compose
        run: |
          scp -i ~/.ssh/id_deploiement -P "${{ secrets.SSH_PORT || 22 }}" \
            docker-compose.prod.yml \
            "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}:~/groupachat/docker-compose.prod.yml"

      - name: Tirer les images et redémarrer
        run: |
          ssh -i ~/.ssh/id_deploiement -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_UTILISATEUR }}@${{ secrets.SSH_HOTE }}" \
            "ETIQUETTE='${{ needs.publier.outputs.etiquette }}' bash -s" <<'FIN'
          set -e
          cd ~/groupachat

          # Le `.env` du serveur n'est **jamais** envoyé par ce workflow : il
          # contient les secrets de production et vit sur la machine, écrit une
          # fois à la main. Voir DEPLOIEMENT.md.
          if [ ! -f .env ]; then
            echo "✗ ~/groupachat/.env est absent. Voir DEPLOIEMENT.md." >&2
            exit 1
          fi

          # L'étiquette à servir est la seule valeur que le déploiement écrit
          # dans le `.env`. `grep -v` puis réécriture plutôt que `sed -i` : si
          # la ligne n'existe pas encore, `sed` ne l'ajouterait pas.
          grep -v '^ETIQUETTE=' .env > .env.tmp || true
          echo "ETIQUETTE=${ETIQUETTE}" >> .env.tmp
          mv .env.tmp .env

          docker compose -f docker-compose.prod.yml pull
          # `--remove-orphans` : retire les conteneurs d'un service supprimé du
          # fichier — c'est ce qui a nettoyé l'ancien service `vitrine`.
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Les migrations tournent dans le point d'entrée de l'image, donc
          # rien à lancer ici. On attend que l'API réponde pour que l'échec
          # d'un démarrage fasse échouer le déploiement au lieu de passer
          # inaperçu.
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT_API:-8000}/api/campagnes/" >/dev/null 2>&1; then
              echo "→ l'API répond."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "✗ l'API ne répond pas après 30 s :" >&2
              docker compose -f docker-compose.prod.yml logs --tail 50 api >&2
              exit 1
            fi
            sleep 1
          done

          # Les images remplacées ne sont plus référencées et occupent la
          # place : un petit VPS sature vite. On ne touche qu'aux images, pas
          # aux volumes — `docker system prune` emporterait la base.
          docker image prune -f
          echo "→ déploiement terminé : ${ETIQUETTE}"
          FIN

      - name: Retirer la clé
        # `always()` : la clé doit disparaître même si le déploiement a échoué.
        if: always()
        run: rm -f ~/.ssh/id_deploiement
