# ╭──────────────────────────────────────────────────────────────────────────╮
# │ Le fichier du SERVEUR — images déjà construites, rien à compiler         │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# ## En quoi il diffère de `docker-compose.yml`
#
# | | `docker-compose.yml` | **ce fichier** |
# |---|---|---|
# | Les images | `build:` — construites sur place | `image:` — **tirées du registre** |
# | Pour | la machine de développement | le serveur |
# | Besoins | Node, le code source | Docker seul |
#
# ⚠️ **Le serveur ne construit rien, et c'est le point de tout ce fichier.**
# Un `vite build` demande Node, les 300 Mo de `node_modules` et plus de
# mémoire que n'en a un petit VPS à un cœur. Faire construire le serveur, c'est
# aussi déployer un code différent de celui qu'on a testé : l'intégration
# continue a validé **une image**, autant déployer cette image-là. Le serveur
# n'a donc besoin ni du code source, ni de Node, ni de Python.
#
# Les images viennent de GHCR, publiées par `.github/workflows/deploiement.yml`.
# `IMAGE_PREFIXE` vaut `ghcr.io/<proprietaire>/<depot>` et `ETIQUETTE` la
# version à servir — les deux sont écrites dans le `.env` du serveur par le
# déploiement.

name: groupachat

services:
  base:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groupachat}
      POSTGRES_USER: ${POSTGRES_USER:-groupachat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groupachat} -d ${POSTGRES_DB:-groupachat}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Aucun `ports:` — la base ne parle qu'à l'API, par le réseau interne.

  api:
    image: ${IMAGE_PREFIXE:?renseignez IMAGE_PREFIXE dans .env}/api:${ETIQUETTE:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-groupachat}:${POSTGRES_PASSWORD}@base:5432/${POSTGRES_DB:-groupachat}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?renseignez DJANGO_SECRET_KEY dans .env}
      # ⚠️ Pas de valeur par défaut permissive ici : sur un serveur, `DEBUG=1`
      # afficherait la trace complète **et les réglages** — donc les
      # identifiants de la base — à quiconque déclenche une erreur 500.
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?renseignez le nom de domaine dans .env}
      CORS_ORIGINES: ${CORS_ORIGINES:?renseignez CORS_ORIGINES dans .env}
      SMS_FOURNISSEUR: ${SMS_FOURNISSEUR:-}
      # `0` : on ne réécrit pas le jeu de démonstration par-dessus des données
      # réelles à chaque redémarrage du serveur.
      CHARGER_DEMO: ${CHARGER_DEMO:-0}
    ports:
      - "${PORT_API:-8000}:8000"
    depends_on:
      base:
        condition: service_healthy
    restart: unless-stopped
  # ⚠️⚠️ **Les services `boutique` et `admin` ont ete retires d'ici.**
  #
  # Ils servaient les deux images nginx publiees par le workflow. Le front est
  # desormais construit et servi par **Coolify**, qui n'a besoin ni d'image ni
  # de serveur web dans ce depot : il execute `npm run build` et publie
  # `frontend/dist/` et `frontend/dist-admin/`.
  #
  # Ce fichier ne decrit donc plus que ce qui tourne **en conteneur** : la
  # base, l'API, et la tache de cloture.
  #
  # ⚠️ **L'avertissement qui vivait sur le service `admin` reste vrai, et il
  # change seulement d'adresse.** Cet ecran affiche des noms, des numeros et
  # des references de pieces d'identite ; il etait publie sur `127.0.0.1:` pour
  # n'etre atteignable que par un tunnel SSH. Ce prefixe n'existe plus ici :
  # **c'est desormais a Coolify de restreindre l'acces** a ce sous-domaine.
  # Il est maintenant protege par un mot de passe — voir
  # `comptes/sessions_admin.py` — mais une page d'administration ouverte sur
  # Internet reste une page d'administration ouverte sur Internet.


  # ── La cloture par la date ────────────────────────────────────────────
  #
  # ⚠️⚠️ **Sans ce service, le produit ne gagne jamais d'argent.**
  #
  # Rien ne s'execute quand une date de fin passe. Un groupage echu reste
  # `ouverte`, aucun `Retrait` n'est cree, et **l'argent deja encaisse ne
  # devient jamais retirable** — ni pour le groupeur, ni pour nos 1 500 F. La
  # commande existait depuis le debut et n'etait planifiee **nulle part** : ni
  # dans Compose, ni dans la CI, ni dans la documentation de deploiement.
  #
  # ⚠️ **Une boucle dans un conteneur plutot que la crontab de l'hote**, et
  # c'est un choix. La crontab vit en dehors du depot : elle s'oublie a la
  # reinstallation du serveur, et rien dans le projet ne dirait qu'elle
  # manque. Ici la tache est **versionnee avec le reste** et repart avec
  # `docker compose up`.
  #
  # **Toutes les dix minutes.** La cloture n'a pas besoin d'etre a la seconde
  # — une date de fin tombe a 23 h 59 — et une boucle qui tourne sans cesse
  # ferait du bruit dans les journaux pour rien. Dix minutes bornent le retard
  # a dix minutes.
  #
  # ⚠️ **La commande est sans effet s'il n'y a rien a cloturer**, donc la
  # repeter ne risque rien : elle ne traite que les groupages dont la date est
  # passee et qui sont encore `ouverte`.
  taches:
    image: ${IMAGE_PREFIXE:?renseignez IMAGE_PREFIXE dans .env}/api:${ETIQUETTE:-latest}
    # ⚠️ **`entrypoint: []` annule celui de l'image.** Le point d'entree de
    # l'API applique les migrations puis lance gunicorn : sans cette ligne, ce
    # conteneur ouvrirait un **second serveur web** et rejouerait les
    # migrations en parallele du premier.
    entrypoint: []
    command:
      - sh
      - -c
      - |
        while true; do
          python manage.py cloturer_les_groupages_echus || true
          sleep 600
        done
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-groupachat}:${POSTGRES_PASSWORD}@base:5432/${POSTGRES_DB:-groupachat}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?renseignez DJANGO_SECRET_KEY dans .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?renseignez le nom de domaine dans .env}
      CORS_ORIGINES: ${CORS_ORIGINES:?renseignez CORS_ORIGINES dans .env}
    depends_on:
      base:
        condition: service_healthy
      # ⚠️ **Apres l'API**, qui applique les migrations dans son point
      # d'entree. Demarrer en meme temps ferait tourner la commande sur un
      # schema incomplet au tout premier deploiement.
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  donnees-postgres:
