# L'administration — écran A1.
#
# Sert `dist-admin/`, le paquet produit par `vite.admin.config.ts`.
#
# ⚠️ **Une image séparée, et c'est la raison d'être de ce fichier.** Le paquet
# d'administration transporte des montants détenus, des files de travail et des
# libellés d'alertes. Le mêler à la boutique le ferait télécharger par chaque
# acheteur de Lomé, sur un forfait de données limité — et il suffirait de
# connaître un nom de fichier pour l'ouvrir.
#
# ⚠️ **Un conteneur séparé n'authentifie toujours personne.** L'écran A1
# s'ouvre sans mot de passe ; ce sont les routes de l'API qui exigent le jeton
# `X-Jeton-Admin`. La séparation réduit la surface exposée et permet deux
# règles de pare-feu distinctes. Elle ne remplace pas un contrôle d'accès.
#
# ⚠️ Même piège qu'ailleurs : **`add_header` dans un `location` remplace tous
# ceux du parent.** Aucun `add_header` dans un `location`, sauf là où l'on est
# contraint — et on les y réécrit tous.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index admin.html;

    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "same-origin"        always;
    add_header Permissions-Policy
        "camera=(), microphone=(), payment=(), geolocation=()"  always;

    # ⚠️ **Jamais indexé.** Un outil interne n'a rien à faire dans un moteur
    # de recherche, et `robots.txt` ne suffit pas : il demande poliment, cet
    # en-tête commande.
    add_header X-Robots-Tag  "noindex, nofollow"  always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ── Toute demande de page va sur `admin.html` ─────────────────────────
    #
    # L'administration n'a aucune adresse profonde : il n'y a qu'un écran. Le
    # repli ramène donc tout vers sa page, et il n'existe **pas** d'`index.html`
    # dans ce paquet — `vite.admin.config.ts` ne construit que `admin.html`.
    location / {
        try_files $uri $uri/ /admin.html;
    }

    location = /admin.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        # Réécrits parce que l'`add_header` ci-dessus a effacé ceux du bloc
        # `server` — y compris le `X-Robots-Tag`, qu'il serait coûteux de
        # perdre précisément sur la page qu'on ne veut pas voir indexée.
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header X-Frame-Options           "DENY"               always;
        add_header Referrer-Policy           "same-origin"        always;
        add_header X-Robots-Tag              "noindex, nofollow"  always;
        add_header Permissions-Policy
            "camera=(), microphone=(), payment=(), geolocation=()"  always;
    }
}
