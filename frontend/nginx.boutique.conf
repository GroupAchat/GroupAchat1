# La boutique — acheteur, groupeur, livreur.
#
# Sert `dist/`, le paquet produit par `vite.config.ts`.
#
# ⚠️ **`add_header` dans un `location` REMPLACE tous ceux du bloc parent, il
# ne s'y ajoute pas.** C'est le piège de nginx, et il coûte cher : une
# directive de cache posée dans `location /assets/` effacerait silencieusement
# **tous** les en-têtes de sécurité déclarés plus haut, précisément sur les
# fichiers les plus servis. On n'écrit donc **aucun `add_header` dans un
# `location`** de ce fichier ; le cache passe par `expires`, qui n'a pas cet
# effet de bord.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Les en-têtes de sécurité, déclarés une seule fois ──────────────────
    #
    # `always` : sans lui, ils ne sont posés que sur les réponses 2xx et 3xx.
    # Une page d'erreur 404 ou 500 repartirait donc sans eux — et c'est
    # souvent là qu'on injecte quelque chose.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "same-origin"        always;
    # Le navigateur n'a besoin ni de la caméra, ni du micro, ni du paiement
    # natif. La géolocalisation est demandée à l'écran de commande, donc elle
    # reste autorisée pour l'origine elle-même.
    add_header Permissions-Policy
        "camera=(), microphone=(), payment=(), geolocation=(self)"  always;

    # La compression. `gzip_vary` évite qu'un cache intermédiaire serve une
    # réponse compressée à un client qui ne la comprend pas.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ── Les fichiers versionnés ───────────────────────────────────────────
    #
    # Vite leur donne une empreinte dans le nom (`index-DSm7x9x7.js`) : leur
    # contenu ne change jamais sous un nom donné, donc un an de cache est sûr
    # et `immutable` dispense le navigateur de toute revalidation.
    #
    # ⚠️ Pas d'`add_header` ici — voir l'en-tête du fichier. `expires` suffit
    # et ne détruit rien.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ── ⚠️ L'administration n'est pas servie par ce conteneur ─────────────
    #
    # `dist/` ne contient pas `admin.html` — `vite.config.ts` ne construit que
    # `index.html`. Mais sans ce garde, la demande tomberait dans le repli SPA
    # ci-dessous et renverrait **la boutique** avec un code 200, ce qui laisse
    # croire que l'adresse existe. On répond 404, qui est la vérité.
    location = /admin.html {
        return 404;
    }

    # ── Le repli d'application monopage ───────────────────────────────────
    #
    # `try_files $uri $uri/` sert d'abord les vrais fichiers — dont
    # `/presentation/index.html`, que nginx résout seul là où le serveur de
    # développement de Vite ne le faisait pas. Le reste va sur `index.html`,
    # parce que les adresses profondes sont gérées par le routeur React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` ne doit **jamais** être mis en cache : c'est lui qui porte
    # les noms empreintés des fichiers ci-dessus. Mis en cache, un navigateur
    # réclamerait éternellement l'ancien JavaScript après un déploiement.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        # ⚠️ Les en-têtes de sécurité sont **répétés ici**, et ce n'est pas un
        # copier-coller distrait : l'`add_header` ci-dessus a effacé ceux du
        # bloc `server`. C'est exactement le piège décrit en tête de fichier,
        # et le seul endroit où l'on est obligé de le subir.
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header X-Frame-Options           "DENY"               always;
        add_header Referrer-Policy           "same-origin"        always;
        add_header Permissions-Policy
            "camera=(), microphone=(), payment=(), geolocation=(self)"  always;
    }
}
